actions:
  openapiDirectoryCreated: false
  reason: >-
    Nothing real was harvested. Every candidate spec path on developer.ehi.com returned
    an AEM soft-404 HTML body or a hard 404, and the API Catalog that would list specs
    is behind Azure AD B2C. No spec was invented, and no endpoint, host or scope was
    inferred.
  apisYmlApis: 3
  apisYmlNote: >-
    The three apis[] entries are the three API business lines the public portal itself
    documents. None carries a baseURL because none is published. If a partner account
    is ever obtained, the gated API Catalog is the place to replace these with real
    named APIs and specs.
contractDiscovery:
  round: 2
  date: '2026-07-28'
  conclusion: >-
    Still no OpenAPI, Swagger, GraphQL SDL, AsyncAPI, Protobuf or MCP server for
    the Rental, Replacement Rental or Commute business lines — those remain behind
    Azure AD B2C. But the round-1 conclusion that "no base URL and no endpoint is
    published publicly" was too strong. A harder pass against the API host root,
    the identity host and the portal's own page source turned up four real
    machine-readable surfaces.
  finds:
    - kind: api-host
      value: https://api.ehi.com
      evidence: >-
        Resolves (Imperva, 45.60.31.129) and answers every request with a JSON
        body {"message":"no Route matched with those values","request_id":"..."}
        plus an x-kong-response-latency header — a live Kong Gateway. HSTS
        max-age=31536000, TLSv1.3. Round 1 probed api.enterprisemobility.com
        (NXDOMAIN) but not api.ehi.com.
      status: 404
    - kind: published-endpoints
      value: >-
        POST /marketplace/experience/profile/{profileId}/retrieve-user-content,
        /favorite-content, /unfavorite-content on api.ehi.com
      evidence: >-
        Declared verbatim in <div hidden class="api-endpoint-details"
        data-attr-retrieveapi-url=... data-attr-favoriteapi-url=...
        data-attr-unfavorite-url=...> in the anonymous page source of
        https://developer.ehi.com/ and every /apis-overview/ page. The call
        semantics (POST, application/json, Authorization Bearer, ehi-origin-identity
        id_token, Ehi-Calling-Application, request body {contentType, contentId},
        response {favorites:[{contentId, contentType, createdDateTime}]}) come from
        /etc.clientlibs/ehimarketplace/clientlibs/clientlib-site.min.js.
      note: >-
        These are the marketplace's own backend-for-frontend, not the gated
        business-line APIs. Anonymous calls to them return the Kong no-route 404.
    - kind: oidc-discovery
      value: >-
        https://apimarketplaceprod.b2clogin.com/apimarketplaceprod.onmicrosoft.com/{B2C_1A_SIGNIN,B2C_1A_SIGNUP}/v2.0/.well-known/openid-configuration
      status: 200
      evidence: >-
        Two anonymously readable OpenID Connect discovery documents — issuer
        da7e3fca-e451-444b-9c27-65c9b61e22c2, RS256, pairwise subjects, jwks_uri,
        and the custom claims extension_organizations and extension_approved that
        encode the partner gate. Saved verbatim to well-known/.
    - kind: oauth-scopes
      value: 14 scopes (12 resource + openid + offline_access)
      evidence: >-
        The B2C_1A_SIGNIN authorize link published in the portal's page source
        requests api.list, api.search, client-application.create/read/list/search/
        manage-owners/request-authorization, member.list and
        favorite.create/list/delete under the resource
        https://apimarketplaceprod.onmicrosoft.com/api. The discovery document
        advertises only "openid", so the authorize link is the authoritative
        published source.
    - kind: error-envelope
      value: '{"errors":[{"code":"...","localizedMessage":"..."}]}'
      evidence: >-
        Error handlers in clientlib-site.min.js read
        responseJSON.errors[0].code and responseJSON.errors[0].localizedMessage
        and log them as "BFF Error". Vendor envelope, not RFC 9457.
  stillAbsent:
    - OpenAPI / Swagger / GraphQL / AsyncAPI / Protobuf / MCP
    - llms.txt (302s to the AEM 404 template on developer.ehi.com)
    - security.txt on every host
    - SDKs on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, crates.io
    - Public GitHub organization (entegral, enterprise-holdings, ehi-tech all 404)
    - Postman collection or workspace
    - Public status page (status./trust. subdomains NXDOMAIN on both domains)
    - Public, dated release notes (dashboard route 302s to B2C)
    - Sandbox, test credentials or trial access
    - CLI, embedded components, decline codes
  additionalProbes:
