note: >-
  This is the most consequential artifact for anyone integrating with Enterprise,
  because the published license does the opposite of what a lifecycle policy
  normally does: it expressly disclaims availability, reserves the right to
  change or remove functionality without compensation, and puts the cost of
  breakage on the licensee. Release Notes exist in the marketplace but sit behind
  Azure AD B2C, so no dated change history is publicly readable.
