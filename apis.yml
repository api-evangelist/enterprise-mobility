aid: enterprise-mobility
url: https://raw.githubusercontent.com/api-evangelist/enterprise-mobility/refs/heads/main/apis.yml
name: Enterprise Mobility
kind: company
description: >-
  Enterprise Mobility is the Clayton, Missouri parent of Enterprise Rent-A-Car,
  National Car Rental and Alamo Rent a Car, and the largest car rental provider in
  the world — 90,000+ team members, 9,500+ rental branches across more than 90
  countries and territories, a global fleet of over 2.4 million vehicles and $39
  billion in 2025 fiscal-year revenue. Beyond leisure and corporate car rental it
  operates fleet management, flexible vehicle hire, carsharing, vanpooling, truck
  rental, car sales, vehicle subscription and the ARMS / Entegral replacement-rental
  technology used by insurers, collision repairers and dealerships. In the United
  States travel distribution chain it is a ground-transportation supplier whose
  inventory reaches buyers through GDS and OTA intermediaries, corporate travel
  programs and its own direct brand sites, rather than through any published public
  booking API. Its API posture is partner-gated and honestly so: EHI runs a real API
  Marketplace at developer.ehi.com with public marketing overviews for three business
  lines — Rental, Replacement Rental and Commute — but the API catalog, API specs,
  guides and release notes all sit behind Azure AD B2C sign-in and the portal states
  access is for "an Enterprise employee or trusted Partner" who should "contact your
  account manager ... to request access". No OpenAPI is published for those business
  lines; probes of /openapi.json, /swagger.json, /api-docs and /.well-known/ return
  AEM soft-404 HTML or 404. What is public is the plumbing around the gate: the
  production API gateway at api.ehi.com is a live Kong Gateway behind Imperva, the
  marketplace's own experience API publishes three POST endpoints in the portal's
  anonymous page source, the Azure AD B2C tenant serves two readable OpenID Connect
  discovery documents, and the sign-in link enumerates fourteen OAuth scopes covering
  catalog search, client-application registration and authorization requests. The
  published API License Agreement
  grants only a "limited, revocable, non-transferable, non-sublicensable,
  non-exclusive" right, restricts use to the licensee's internal purpose, states the
  licensee has no ownership rights in Renter Information, and on termination requires
  the licensee to "delete or return any copies of the APIs and Enterprise Content" —
  public docs shell, gated specs, no exit path.
