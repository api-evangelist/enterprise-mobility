apis:
  - aid: enterprise-mobility:ehi-rental-apis
    name: EHI Rental APIs
    description: >-
      The Rental business line of the EHI API Marketplace, covering Enterprise
      Rent-A-Car's network of neighborhood and airport branches. The public overview
      page describes the capabilities as vehicle rental beyond traditional car rental
      and directs prospective consumers to register as an Enterprise employee or
      trusted Partner to shop the API catalog. No API names, base URL, endpoints,
      authentication scheme or specification are published outside the Azure AD B2C
      sign-in.
    humanURL: https://developer.ehi.com/apis-overview/rental.html
    tags:
      - Car Rental
      - Reservations
      - Travel
    properties:
      - type: Documentation
        url: https://developer.ehi.com/apis-overview/rental.html
      - type: Portal
        url: https://developer.ehi.com/
      - type: Website
        url: https://www.enterprise.com/en/home.html
      - type: TermsOfService
        url: https://developer.ehi.com/general/terms-of-use.html
  - aid: enterprise-mobility:ehi-replacement-rental-apis
    name: EHI Replacement Rental APIs
    description: >-
      The Replacement Rental business line of the EHI API Marketplace, exposing the
      ARMS (Automated Rental Management System) and Entegral platforms to insurance
      providers, collision repair shops, dealership partners and fleet maintenance
      companies. The public overview page segments the capability set into three
      groups — Communication ("electronically send and receive messages from the
      rental branch"), Lifecycle ("manage the entire lifecycle of your rentals, from
      authorization to payment") and Data ("view critical data about your
      organization, including average length of rental, average cost of rental and
      more") — and closes with "Note: Contact your account manager for more
      information and to request access." No specification, base URL or endpoint is
      published publicly.
    humanURL: https://developer.ehi.com/apis-overview/replacement-rental.html
    tags:
      - Replacement Rental
      - Insurance
      - Collision Repair
      - Claims
    properties:
      - type: Documentation
        url: https://developer.ehi.com/apis-overview/replacement-rental.html
      - type: Portal
        url: https://developer.ehi.com/
      - type: Website
        url: https://www.entegral.com/
      - type: TermsOfService
        url: https://developer.ehi.com/general/terms-of-use.html
  - aid: enterprise-mobility:ehi-commute-apis
    name: EHI Commute APIs
    description: >-
      The Commute business line of the EHI API Marketplace, covering Commute with
      Enterprise vanpooling and rideshare-to-work programs sold to employers. The
      public overview page describes the capability as APIs that "manage the process
      and create better experiences for your riders", grouped as finding co-workers
      nearby, vehicle selection, and onboarding and maintenance support. No API
      names, base URL, endpoints or specification are published outside the gated
      catalog.
    humanURL: https://developer.ehi.com/apis-overview/commute.html
    tags:
      - Vanpool
      - Rideshare
      - Commute
      - Corporate Travel
    properties:
      - type: Documentation
        url: https://developer.ehi.com/apis-overview/commute.html
      - type: Portal
        url: https://developer.ehi.com/
      - type: TermsOfService
        url: https://developer.ehi.com/general/terms-of-use.html
  - aid: enterprise-mobility:ehi-marketplace-experience-api
    name: EHI API Marketplace Experience API
    description: >-
      The backend-for-frontend that powers the EHI API Marketplace itself, and the
      only Enterprise Mobility API surface with endpoints published anonymously.
      Three POST operations are declared verbatim in the api-endpoint-details element
      of every public developer.ehi.com page —
      /marketplace/experience/profile/{profileId}/retrieve-user-content,
      /favorite-content and /unfavorite-content — and the marketplace client library
      shows exactly how they are called: JSON bodies of {contentType, contentId}, an
      Authorization Bearer access token from Azure AD B2C, the B2C id_token repeated
      in an ehi-origin-identity header, and Ehi-Calling-Application / ehi-application-name
      caller headers. Errors come back as {"errors":[{"code","localizedMessage"}]}.
      The host, https://api.ehi.com, is a live Kong Gateway behind Imperva that
      returns a JSON no-route 404 with a request_id to anonymous callers. Enterprise
      publishes no OpenAPI for this API; the operations above are recorded from the
      provider's own published page source and client library, and nothing beyond
      them is asserted.
    humanURL: https://developer.ehi.com/
    baseURL: https://api.ehi.com
    tags:
      - Developer Portal
      - API Marketplace
      - Identity
    properties:
      - type: Portal
        url: https://developer.ehi.com/
      - type: Authentication
        url: authentication/enterprise-mobility-authentication.yml
      - type: OAuthScopes
        url: scopes/enterprise-mobility-scopes.yml
      - type: Conventions
        url: conventions/enterprise-mobility-conventions.yml
      - type: ErrorCatalog
        url: errors/enterprise-mobility-problem-types.yml
      - type: TermsOfService
        url: https://developer.ehi.com/general/terms-of-use.html
